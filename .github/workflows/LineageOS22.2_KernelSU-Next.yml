name: Build Miatoll Hacking Kernel V2
on:
  workflow_dispatch:
env:
  TZ: America/New_York
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
jobs:
  build:
    name: Build Kernel for Miatoll
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4.2.2

    - name: Set swap to 10G
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Parche de Compatibilidad para libtinfo5
      run: |
        sudo apt-get update
        sudo apt-get install -y libtinfo6
        sudo ln -sf /lib/x86_64-linux-gnu/libtinfo.so.6 /lib/x86_64-linux-gnu/libtinfo.so.5

    - name: Setup build kernel environment
      run: |
        sudo apt-get update
        sudo apt-get install git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib bzip2 libbz2-dev liblz4-tool make squashfs-tools dpkg-dev libssl-dev python3 bc libc6-dev-i386 libncurses5-dev
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: Download Official Android Toolchains
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 --depth=1 -b master clang-aosp
        git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 --depth=1 gcc-64
        git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 --depth=1 gcc-32

    - name: Download kernel source
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        # Clonación limpia del repositorio real de crDroid (Plataforma SM6250 para Miatoll)
        git clone https://github.com/crdroidandroid/android_kernel_xiaomi_sm6250 -b 16.0 android-kernel --depth=1
        cd android-kernel/scripts
        sed -i 's/ -dirty//g' setlocalversion

    - name: Setup Official KernelSU
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s main

    - name: Inject NetHunter Patches into Defconfig
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        DEFCONFIG="arch/arm64/configs/miatoll_defconfig"
        echo "CONFIG_SYSVIPC=y" >> $DEFCONFIG
        echo "CONFIG_SYSVIPC_SYSCTL=y" >> $DEFCONFIG
        echo "CONFIG_MODULES=y" >> $DEFCONFIG
        echo "CONFIG_MODULE_UNLOAD=y" >> $DEFCONFIG
        echo "CONFIG_WIRELESS=y" >> $DEFCONFIG
        echo "CONFIG_CFG80211=m" >> $DEFCONFIG
        echo "CONFIG_MAC80211=m" >> $DEFCONFIG
        echo "CONFIG_CFG80211_WEXT=y" >> $DEFCONFIG
        echo "CONFIG_ATH_CARDS=m" >> $DEFCONFIG
        echo "CONFIG_ATH9K_HTC=m" >> $DEFCONFIG
        echo "CONFIG_RTL8187=m" >> $DEFCONFIG
        echo "CONFIG_RT2X00=m" >> $DEFCONFIG
        echo "CONFIG_RT2800USB=m" >> $DEFCONFIG
        echo "CONFIG_USB_G_ANDROID=y" >> $DEFCONFIG
        echo "CONFIG_USB_F_HID=y" >> $DEFCONFIG
        echo "CONFIG_USB_CONFIGFS_F_HID=y" >> $DEFCONFIG
        echo "CONFIG_NAMESPACES=y" >> $DEFCONFIG
        echo "CONFIG_USER_NS=y" >> $DEFCONFIG
        echo "CONFIG_PID_NS=y" >> $DEFCONFIG
        echo "CONFIG_NET_NS=y" >> $DEFCONFIG
        echo "CONFIG_BLK_DEV_LOOP=y" >> $DEFCONFIG

    - name: Build Miatoll kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        CLANG_BIN_PATH=$(find $GITHUB_WORKSPACE/kernel_workspace/clang-aosp -name "clang" -type f -path "*/bin/*" | head -n 1 | sed 's/\/clang//')
        export ARCH=arm64
        export SUBARCH=arm
        export PATH="${CLANG_BIN_PATH}:${GITHUB_WORKSPACE}/kernel_workspace/gcc-64/bin:${GITHUB_WORKSPACE}/kernel_workspace/gcc-32/bin:${PATH}"
        export KBUILD_BUILD_HOST=Github-Action
        export KBUILD_BUILD_USER=$(echo ${{ github.actor }} | tr A-Z a-z)
        
        CC_ARGS="
          ARCH=arm64 \
          CC=clang \
          CLANG_TRIPLE=aarch64-linux-gnu- \
          CROSS_COMPILE=aarch64-linux-android- \
          CROSS_COMPILE_ARM32=arm-linux-androideabi- \
          LD=ld.lld \
          AR=llvm-ar \
          NM=llvm-nm \
          OBJCOPY=llvm-objcopy \
          OBJDUMP=llvm-objdump \
          STRIP=llvm-strip
        "
        make O=out $CC_ARGS miatoll_defconfig
        make -j$(nproc --all) O=out $CC_ARGS

    - name: Check and Locate Kernel Output Files
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        BOOT_DIR="android-kernel/out/arch/arm64/boot"
        FOUND_IMG=""
        for f in Image.gz-dtb Image.gz Image Image-dtb; do
            if [ -f "$BOOT_DIR/$f" ]; then
                FOUND_IMG="$BOOT_DIR/$f"
                echo "KERNEL_FILE_NAME=$f" >> $GITHUB_ENV
                break
            fi
        done
        if [ -n "$FOUND_IMG" ]; then
            echo "✅ ¡Kernel detectado con éxito en: $FOUND_IMG!"
            echo "CHECK_IMAGE=true" >> $GITHUB_ENV
        else
            echo "🚨 ERROR: No se encontró ningún binario Image válido en $BOOT_DIR"
            exit 1
        fi

    - name: Make AnyKernel3
      if: env.CHECK_IMAGE == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
        cp android-kernel/out/arch/arm64/boot/${{ env.KERNEL_FILE_NAME }} AnyKernel3/${{ env.KERNEL_FILE_NAME }}
        sed -i "s/kernel.string=.*/kernel.string=Miatoll Hacking Kernel por ${{ github.actor }}/g" AnyKernel3/anykernel.sh
        rm -rf AnyKernel3/.git* AnyKernel3/README.md
        cd AnyKernel3
        zip -r9 ../Miatoll-NetHunter-Kernel.zip *

    - name: Upload Artifact
      if: env.CHECK_IMAGE == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: AK3-Miatoll-NetHunter-KSU
        path: kernel_workspace/Miatoll-NetHunter-Kernel.zip
