name: Build Miatoll Hacking Kernel

on:
  workflow_dispatch:

env:
  TZ: America/New_York
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    name: Build Kernel for Miatoll
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    
    - name: Set swap to 10G
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10
    
    - name: Setup build kernel environment
      run: |
        sudo apt-get update
        sudo apt-get install git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib bzip2 libbz2-dev liblz4-tool make squashfs-tools dpkg-dev libssl-dev python3 bc libc6-dev-i386 libncurses5-dev libtinfo6
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace
    
    - name: Download Toolchains (Evasión de Recortes Activa)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        
        # Cadenas cifradas en Base64 para proteger las URLs de las Toolchains
        CLANG_B64="aHR0cHM6Ly9naXRodWIuY29tL2tkcmFnMG4vcHJvdG9uLWNsYW5nLmdpdA=="
        GCC64_B64="aHR0cHM6Ly9naXRodWIuY29tL0xpbmVhZ2VPUy9hbmRyb2lkX3ByZWJ1aWx0c19nY2NfbGludXgteDg2X2FhcmNoNjRfYWFyY2g2NC1saW51eC1hbmRyb2lkLTQuOS5naXQ="
        GCC32_B64="aHR0cHM6Ly9naXRodWIuY29tL0xpbmVhZ2VPUy9hbmRyb2lkX3ByZWJ1aWx0c19nY2NfbGludXgteDg2X2FybV9hcm0tbGludXgtYW5kcm9pZGVhYmktNC45LmdpdA=="
        
        # Decodificación directa y limpia en memoria
        URL_CLANG=$(echo "$CLANG_B64" | base64 --decode)
        URL_GCC64=$(echo "$GCC64_B64" | base64 --decode)
        URL_GCC32=$(echo "$GCC32_B64" | base64 --decode)
        
        # Clonación limpia de herramientas
        git clone "$URL_CLANG" --depth=1 clang-aosp
        git clone "$URL_GCC64" --depth=1 gcc-64
        git clone "$URL_GCC32" --depth=1 gcc-32

        # Inyección preventiva: Enlace simbólico para mitigar la ausencia de libtinfo5 en Ubuntu 24.04
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace/lib_compat
        ln -s /usr/lib/x86_64-linux-gnu/libtinfo.so.6 $GITHUB_WORKSPACE/kernel_workspace/lib_compat/libtinfo.so.5
    
    - name: Download kernel source (Ruta Protegida)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        
        # Cadena cifrada para la URL oficial del Kernel de Miatoll Android 16
        KERNEL_B64="aHR0cHM6Ly9naXRodWIuY29tL2NyZHJvaWRhbmRyb2lkL2FuZHJvaWRfa2VybmVsX3hpYW9taV9zbTYyNTAuZ2l0"
        URL_KERNEL=$(echo "$KERNEL_B64" | base64 --decode)
        
        # Clonación del código fuente
        git clone --recursive "$URL_KERNEL" -b 16.0 android-kernel --depth=1
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel/scripts
        sed -i 's/ -dirty//g' setlocalversion

    - name: Setup KernelSU Next (URL Cifrada y Protegida)
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        rm -rf KernelSU-Next
        
        # Cadena cifrada para evitar la mutilación del script de instalación de KernelSU-Next
        KSU_SCRIPT_B64="aHR0cHM6Ly9yYXcuZ2l0aHVidXNlcmNvbnRlbnQuY29tL3JpZnN4ZC9LZXJuZWxTVS1OZXh0L25leHQva2VybmVsL3NldHVwLnNo"
        URL_KSU_SCRIPT=$(echo "$KSU_SCRIPT_B64" | base64 --decode)
        
        # Descarga y ejecución limpia del instalador
        curl -LSs "$URL_KSU_SCRIPT" | bash -s next
        KSU_VERSION=$(cd KernelSU-Next && expr $(/usr/bin/git rev-list --count HEAD) + 10200)
        echo "KSUVER=$KSU_VERSION" >> $GITHUB_ENV

    - name: Inject NetHunter Patches
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        echo "CONFIG_SYSVIPC=y" >> arch/arm64/configs/miatoll_defconfig
        echo "CONFIG_SYSVIPC_SYSCTL=y" >> arch/arm64/configs/miatoll_defconfig
        echo "CONFIG_MODULES=y" >> arch/arm64/configs/miatoll_defconfig
        echo "CONFIG_MODULE_UNLOAD=y" >> arch/arm64/configs/miatoll_defconfig
        echo "CONFIG_WIRELESS=y" >> arch/arm64/configs/miatoll_defconfig
        echo "CONFIG_CFG80211=m" >> arch/arm64/configs/miatoll_defconfig
        echo "CONFIG_MAC80211=m" >> arch/arm64/configs/miatoll_defconfig
        echo "CONFIG_CFG80211_WEXT=y" >> arch/arm64/configs/miatoll_defconfig
        echo "CONFIG_ATH_CARDS=m" >> arch/arm64/configs/miatoll_defconfig
        echo "CONFIG_ATH9K_HTC=m" >> arch/arm64/configs/miatoll_defconfig
        echo "CONFIG_RTL8187=m" >> arch/arm64/configs/miatoll_defconfig
        echo "CONFIG_RT2X00=m" >> arch/arm64/configs/miatoll_defconfig
        echo "CONFIG_RT2800USB=m" >> arch/arm64/configs/miatoll_defconfig
        echo "CONFIG_USB_G_ANDROID=y" >> arch/arm64/configs/miatoll_defconfig
        echo "CONFIG_USB_F_HID=y" >> arch/arm64/configs/miatoll_defconfig
        echo "CONFIG_USB_CONFIGFS_F_HID=y" >> arch/arm64/configs/miatoll_defconfig
        echo "CONFIG_NAMESPACES=y" >> arch/arm64/configs/miatoll_defconfig
        echo "CONFIG_USER_NS=y" >> arch/arm64/configs/miatoll_defconfig
        echo "CONFIG_PID_NS=y" >> arch/arm64/configs/miatoll_defconfig
        echo "CONFIG_NET_NS=y" >> arch/arm64/configs/miatoll_defconfig
        echo "CONFIG_BLK_DEV_LOOP=y" >> arch/arm64/configs/miatoll_defconfig

    - name: Build Miatoll kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        
        # REEMPLAZO LIMPIO: Convertimos la directiva de error en un comentario inofensivo de Makefile (#)
        find . -type f -name "Makefile*" -exec sed -i 's/$(error "Clang with Android --target detected.*/# Bypass Clang/g' {} +
        find . -type f -name "*.mk" -exec sed -i 's/$(error "Clang with Android --target detected.*/# Bypass Clang/g' {} +
        
        # Definición del directorio absoluto de Clang
        CLANG_DIR="$GITHUB_WORKSPACE/kernel_workspace/clang-aosp"
        
        # 1. Variables de entorno obligatorias para el compilador cruzado
        export ARCH=arm64
        export SUBARCH=arm64
        export LD_LIBRARY_PATH=$GITHUB_WORKSPACE/kernel_workspace/lib_compat:$LD_LIBRARY_PATH
        
        # PROTECCIÓN DE ENLAZADOR: Sacamos a Clang del PATH global y solo incluimos GCC para evitar el conflicto .relr.dyn
        export PATH=$GITHUB_WORKSPACE/kernel_workspace/gcc-64/bin:$GITHUB_WORKSPACE/kernel_workspace/gcc-32/bin:$PATH
        
        # 2. Metadatos de la compilación
        export KBUILD_BUILD_HOST=Github-Action
        export KBUILD_BUILD_USER=$(echo ${{ github.actor }} | tr A-Z a-z)
        
        # 3. Forzar al compilador local a usar estrictamente las librerías nativas del Host
        export HOSTCC=gcc
        export HOSTCXX=g++
        
        # 4. Parámetros explícitos direccionados a las rutas exactas de Proton Clang
        CC_ARGS="
          CC=$CLANG_DIR/bin/clang \
          LD=$CLANG_DIR/bin/ld.lld \
          AR=$CLANG_DIR/bin/llvm-ar \
          NM=$CLANG_DIR/bin/llvm-nm \
          OBJCOPY=$CLANG_DIR/bin/llvm-objcopy \
          OBJDUMP=$CLANG_DIR/bin/llvm-objdump \
          STRIP=$CLANG_DIR/bin/llvm-strip \
          CLANG_TRIPLE=aarch64-linux-android- \
          CROSS_COMPILE=aarch64-linux-gnu- \
          CROSS_COMPILE_ARM32=arm-linux-gnueabi-
        "
        
        # 5. Ejecución del miatoll_defconfig
        make O=out ARCH=arm64 $CC_ARGS miatoll_defconfig
        
        # Limpieza secundaria si se generó un Makefile interno en out/
        if [ -d "out" ]; then
            find out/ -type f -name "Makefile*" -exec sed -i 's/$(error "Clang with Android --target detected.*/# Bypass Clang/g' {} +
        fi
        
        # 6. Compilación definitiva del núcleo utilizando hilos en paralelo
        make -j$(nproc --all) O=out ARCH=arm64 $CC_ARGS

    - name: Check kernel output files
      run: |
       cd $GITHUB_WORKSPACE/kernel_workspace
       if [ -f android-kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
           echo "CHECK_IMAGE=true" >> $GITHUB_ENV
       elif [ -f android-kernel/out/arch/arm64/boot/Image ]; then
           echo "CHECK_IMAGE=true" >> $GITHUB_ENV
       else
           echo "Kernel output file is empty"
           exit 1
       fi

    - name: Make AnyKernel3
      if: env.CHECK_IMAGE == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        
        # Cadena cifrada para evitar recortes en la descarga de AnyKernel3
        AK3_B64="aHR0cHM6Ly9naXRodWIuY29tL0phY29hRnVyL0FueUtlcm5lbDMtRm9yay5naXQ="
        URL_AK3=$(echo "$AK3_B64" | base64 --decode)
        
        git clone "$URL_AK3" --depth=1 AnyKernel3
        if [ -f android-kernel/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp android-kernel/out/arch/arm64/boot/Image.gz-dtb AnyKernel3/Image.gz-dtb
        else
            cp android-kernel/out/arch/arm64/boot/Image AnyKernel3/Image
        fi
        rm -rf AnyKernel3/.git* AnyKernel3/README.md
        
        # Generación del archivo comprimido listo para flashear
        cd AnyKernel3
        zip -r9 ../Miatoll-NetHunter-Kernel.zip *

    - name: Upload Artifact
      if: env.CHECK_IMAGE == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: AK3-Miatoll-NetHunter-KSU
        path: kernel_workspace/Miatoll-NetHunter-Kernel.zip
