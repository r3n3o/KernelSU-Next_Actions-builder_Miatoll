name: Build Miatoll Hacking Kernel V13 (NetHunter WiFi Fix)

on:
  workflow_dispatch:

env:
  TZ: America/New_York
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    name: Build Kernel for Miatoll
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set swap to 10G
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Setup build kernel environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib bzip2 libbz2-dev liblz4-tool make squashfs-tools dpkg-dev libssl-dev python3 libelf-dev bc libc6-dev-i386 gcc-multilib lld llvm
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace

      - name: Download crDroid Specific Toolchains
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone --depth=1 https://github.com/crdroidandroid/android_prebuilts_clang_host_linux-x86_clang-6443078 clang
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

      - name: Download kernel source
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone https://github.com/crdroidandroid/android_kernel_xiaomi_sm6250 -b 16.0 android-kernel --depth=1
          cd android-kernel/scripts
          sed -i 's/ -dirty//g' setlocalversion

      - name: Setup KernelSU-Next (Legacy for Non-GKI 4.14)
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/legacy/kernel/setup.sh" | bash -s legacy
          
          echo "[+] Patching KernelSU-Next legacy source for crash prevention on Linux 4.14 non-GKI..."
          
          # 1. Patch NULL pointer dereference in sucompat.c when regs is NULL
          SUCOMPAT_SRC="drivers/kernelsu/feature/sucompat.c"
          if [ -f "$SUCOMPAT_SRC" ]; then
            sed -i 's/const char __user \*const __user \*argv_user =.*/const char __user *const __user *argv_user = regs ? (const char __user *const __user *)PT_REGS_PARM2(regs) : NULL;/g' "$SUCOMPAT_SRC"
          fi
          
          # 2. Patch hook_manager.c to pass valid regs and id to ksu_handle_execve_sucompat
          HOOK_MGR_SRC="drivers/kernelsu/hook/hook_manager.c"
          if [ -f "$HOOK_MGR_SRC" ]; then
            sed -i 's/ksu_handle_execve_sucompat(filename_user, NULL, NULL);/ksu_handle_execve_sucompat(filename_user, id, regs);/g' "$HOOK_MGR_SRC"
          fi
          
          # 3. Patch undefined symbol ksu_input_hook in selinux_hide.c
          SELINUX_HIDE_SRC="drivers/kernelsu/feature/selinux_hide.c"
          if [ -f "$SELINUX_HIDE_SRC" ]; then
            sed -i 's/extern bool ksu_input_hook.*/bool ksu_input_hook __read_mostly __attribute__((weak)) = false;/g' "$SELINUX_HIDE_SRC"
            # Set selinux_hide default to false to prevent libselinux/mmap crash on early Android init
            sed -i 's/static bool ksu_selinux_hide_is_enabled __read_mostly = true;/static bool ksu_selinux_hide_is_enabled __read_mostly = false;/g' "$SELINUX_HIDE_SRC"
          fi

      - name: Inject NetHunter, Wireless & Security Drivers into Native Defconfig
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          DEFCONFIG="arch/arm64/configs/vendor/xiaomi/miatoll_defconfig"
          
          # Patch ath9k_htc symbol conflicts with Qualcomm qca-wifi-host-cmn (htc_start, htc_stop, htc_connect_service)
          HTC_HEADER="drivers/net/wireless/ath/ath9k/htc_hst.h"
          if [ -f "$HTC_HEADER" ]; then
            echo "[+] Patching ath9k_htc symbols to prevent Qualcomm linker collisions..."
            sed -i '1s/^/#define htc_init ath9k_htc_init_internal\n#define htc_connect_service ath9k_htc_connect_service_internal\n#define htc_send ath9k_htc_send_internal\n#define htc_send_epid ath9k_htc_send_epid_internal\n#define htc_stop ath9k_htc_stop_internal\n#define htc_start ath9k_htc_start_internal\n#define htc_sta_drain ath9k_htc_sta_drain_internal\n/' $HTC_HEADER
          fi
          
          # 0. KernelSU-Next y Kprobes
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KSU_DEBUG=n" >> $DEFCONFIG
          echo "CONFIG_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_HAVE_KPROBES=y" >> $DEFCONFIG
          echo "CONFIG_KRETPROBES=y" >> $DEFCONFIG
          
          # Formato de imagen RAW uncompressed para ABL bootloader de Xiaomi SM6250
          echo "CONFIG_BUILD_ARM64_UNCOMPRESSED_KERNEL=y" >> $DEFCONFIG
          
          # 1. Comunicacion IPC y aislamiento de Namespaces (NetHunter Chroot, Docker, Metasploit)
          echo "CONFIG_SYSVIPC=y" >> $DEFCONFIG
          echo "CONFIG_SYSVIPC_SYSCTL=y" >> $DEFCONFIG
          echo "CONFIG_NAMESPACES=y" >> $DEFCONFIG
          echo "CONFIG_USER_NS=y" >> $DEFCONFIG
          echo "CONFIG_PID_NS=y" >> $DEFCONFIG
          echo "CONFIG_NET_NS=y" >> $DEFCONFIG
          echo "CONFIG_BLK_DEV_LOOP=y" >> $DEFCONFIG
          
          # 2. Pila inalambrica, Rate Control Minstrel e Inyeccion de paquetes
          echo "CONFIG_WIRELESS=y" >> $DEFCONFIG
          echo "CONFIG_CFG80211=y" >> $DEFCONFIG
          echo "CONFIG_MAC80211=y" >> $DEFCONFIG
          echo "CONFIG_CFG80211_WEXT=y" >> $DEFCONFIG
          echo "CONFIG_MAC80211_RC_MINSTREL=y" >> $DEFCONFIG
          echo "CONFIG_MAC80211_RC_MINSTREL_HT=y" >> $DEFCONFIG
          echo "CONFIG_MAC80211_RC_DEFAULT_MINSTREL=y" >> $DEFCONFIG
          echo "CONFIG_MAC80211_RC_DEFAULT=\"minstrel_ht\"" >> $DEFCONFIG
          echo "CONFIG_MAC80211_LEDS=y" >> $DEFCONFIG
          echo "CONFIG_MAC80211_MESH=y" >> $DEFCONFIG
          
          # 3. Subsistema Criptografico para WiFi y Drivers
          echo "CONFIG_CRYPTO_ARC4=y" >> $DEFCONFIG
          echo "CONFIG_CRYPTO_AES=y" >> $DEFCONFIG
          echo "CONFIG_CRYPTO_CCM=y" >> $DEFCONFIG
          echo "CONFIG_CRYPTO_GCM=y" >> $DEFCONFIG
          echo "CONFIG_CRYPTO_CMAC=y" >> $DEFCONFIG
          echo "CONFIG_CRYPTO_MICHAEL_MIC=y" >> $DEFCONFIG
          echo "CONFIG_EEPROM_93CX6=y" >> $DEFCONFIG
          echo "CONFIG_CRC_CCITT=y" >> $DEFCONFIG
          echo "CONFIG_CRC_ITU_T=y" >> $DEFCONFIG
          
          # 4. Controladores Wi-Fi USB OTG (Atheros, Realtek, Ralink, MediaTek)
          echo "CONFIG_WLAN_VENDOR_ATH=y" >> $DEFCONFIG
          echo "CONFIG_ATH9K_HTC=y" >> $DEFCONFIG
          echo "CONFIG_CARL9170=y" >> $DEFCONFIG
          echo "CONFIG_CARL9170_LEDS=y" >> $DEFCONFIG
          echo "CONFIG_CARL9170_WPC=y" >> $DEFCONFIG
          
          echo "CONFIG_WLAN_VENDOR_REALTEK=y" >> $DEFCONFIG
          echo "CONFIG_RTL8187=y" >> $DEFCONFIG
          echo "CONFIG_RTL8187_LEDS=y" >> $DEFCONFIG
          echo "CONFIG_RTL8XXXU=y" >> $DEFCONFIG
          echo "CONFIG_RTL8XXXU_UNTESTED=y" >> $DEFCONFIG
          
          echo "CONFIG_WLAN_VENDOR_RALINK=y" >> $DEFCONFIG
          echo "CONFIG_RT2X00=y" >> $DEFCONFIG
          echo "CONFIG_RT2800USB=y" >> $DEFCONFIG
          echo "CONFIG_RT2800USB_RT33XX=y" >> $DEFCONFIG
          echo "CONFIG_RT2800USB_RT35XX=y" >> $DEFCONFIG
          echo "CONFIG_RT2800USB_RT3573=y" >> $DEFCONFIG
          echo "CONFIG_RT2800USB_RT53XX=y" >> $DEFCONFIG
          echo "CONFIG_RT2800USB_RT55XX=y" >> $DEFCONFIG
          echo "CONFIG_RT2800USB_UNKNOWN=y" >> $DEFCONFIG
          echo "CONFIG_RT2500USB=y" >> $DEFCONFIG
          echo "CONFIG_RT73USB=y" >> $DEFCONFIG
          
          echo "CONFIG_WLAN_VENDOR_MEDIATEK=y" >> $DEFCONFIG
          echo "CONFIG_MT7601U=y" >> $DEFCONFIG
          
          # 5. Adaptadores de Red Ethernet USB OTG (Auditoria de Redes Cableadas)
          echo "CONFIG_USB_NET_DRIVERS=y" >> $DEFCONFIG
          echo "CONFIG_USB_USBNET=y" >> $DEFCONFIG
          echo "CONFIG_USB_NET_AX88179_178A=y" >> $DEFCONFIG
          echo "CONFIG_USB_NET_AX8817X=y" >> $DEFCONFIG
          echo "CONFIG_USB_NET_RTL8152=y" >> $DEFCONFIG
          echo "CONFIG_USB_NET_CDCETHER=y" >> $DEFCONFIG
          echo "CONFIG_USB_NET_CDC_NCM=y" >> $DEFCONFIG
          echo "CONFIG_USB_NET_DM9601=y" >> $DEFCONFIG
          echo "CONFIG_USB_NET_SMSC75XX=y" >> $DEFCONFIG
          echo "CONFIG_USB_NET_SMSC95XX=y" >> $DEFCONFIG
          echo "CONFIG_USB_NET_MCS7830=y" >> $DEFCONFIG
          echo "CONFIG_USB_NET_RNDIS_HOST=y" >> $DEFCONFIG
          echo "CONFIG_USB_NET_CDC_SUBSET=y" >> $DEFCONFIG
          
          # 6. Bluetooth USB Externo
          echo "CONFIG_BT=y" >> $DEFCONFIG
          echo "CONFIG_BT_HCIBTUSB=y" >> $DEFCONFIG
          echo "CONFIG_BT_HCIBTUSB_BCM=y" >> $DEFCONFIG
          echo "CONFIG_BT_HCIBTUSB_RTL=y" >> $DEFCONFIG
          echo "CONFIG_BT_HCIUSB=y" >> $DEFCONFIG
          
          # 7. Radiofrecuencia y Software Defined Radio (RTL-SDR)
          echo "CONFIG_MEDIA_SUPPORT=y" >> $DEFCONFIG
          echo "CONFIG_MEDIA_USB_SUPPORT=y" >> $DEFCONFIG
          echo "CONFIG_MEDIA_DIGITAL_TV_SUPPORT=y" >> $DEFCONFIG
          echo "CONFIG_DVB_USB_V2=y" >> $DEFCONFIG
          echo "CONFIG_DVB_USB_RTL28XXU=y" >> $DEFCONFIG
          
          # 8. Emulacion USB HID y Mass Storage (BadUSB y DriveDroid)
          echo "CONFIG_USB_F_HID=y" >> $DEFCONFIG
          echo "CONFIG_USB_CONFIGFS_F_HID=y" >> $DEFCONFIG
          echo "CONFIG_USB_CONFIGFS_MASS_STORAGE=y" >> $DEFCONFIG

      - name: Build Miatoll kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          
          export ARCH=arm64
          export KBUILD_BUILD_HOST=Github-Action
          export KBUILD_BUILD_USER=$(echo ${{ github.actor }} | tr A-Z a-z)
          
          export PATH="${GITHUB_WORKSPACE}/kernel_workspace/clang/bin:${PATH}:${GITHUB_WORKSPACE}/kernel_workspace/gcc32/bin:${PATH}:${GITHUB_WORKSPACE}/kernel_workspace/gcc64/bin:${PATH}"
          
          CC_ARGS="
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=${GITHUB_WORKSPACE}/kernel_workspace/gcc64/bin/aarch64-linux-android- \
            CROSS_COMPILE_ARM32=${GITHUB_WORKSPACE}/kernel_workspace/gcc32/bin/arm-linux-androideabi- \
            LD=ld.lld \
            CONFIG_NO_ERROR_ON_MISMATCH=y \
            KCFLAGS=-w
          "
          
          make O=out $CC_ARGS vendor/xiaomi/miatoll_defconfig
          make -j$(nproc --all) O=out $CC_ARGS all || {
            echo "::error::Build failed in parallel mode! Rerunning with -j1 to isolate exact compiler error:"
            make -j1 O=out $CC_ARGS all
            exit 1
          }

      - name: Check and Locate Kernel Output Files
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          BOOT_DIR="android-kernel/out/arch/arm64/boot"
          
          # Verificar binario Image (crDroid/LineageOS Miatoll usa Image raw uncompressed)
          if [ -f "$BOOT_DIR/Image" ]; then
            echo "KERNEL_FILE_NAME=Image" >> $GITHUB_ENV
            echo "CHECK_IMAGE=true" >> $GITHUB_ENV
            echo "✅ ¡Kernel Image raw detectado con éxito!"
          elif [ -f "$BOOT_DIR/Image.gz" ]; then
            echo "KERNEL_FILE_NAME=Image.gz" >> $GITHUB_ENV
            echo "CHECK_IMAGE=true" >> $GITHUB_ENV
            echo "✅ ¡Kernel Image.gz detectado!"
          else
            echo "🚨 ERROR: No se encontró ningún binario Image válido en $BOOT_DIR"
            exit 1
          fi
          
          # Verificar y preparar DTB para AnyKernel3
          if [ -f "$BOOT_DIR/dtb.img" ]; then
            cp "$BOOT_DIR/dtb.img" $GITHUB_WORKSPACE/kernel_workspace/dtb
            echo "HAVE_DTB=true" >> $GITHUB_ENV
            echo "✅ ¡dtb.img detectado y copiado como dtb!"
          elif [ -f "$BOOT_DIR/dtb" ]; then
            cp "$BOOT_DIR/dtb" $GITHUB_WORKSPACE/kernel_workspace/dtb
            echo "HAVE_DTB=true" >> $GITHUB_ENV
            echo "✅ ¡dtb detectado!"
          fi

      - name: Make AnyKernel3
        run: |
          if [ "$CHECK_IMAGE" != "true" ]; then
            echo "Imagen del kernel no encontrada, saltando creación de AnyKernel3."
            exit 0
          fi

          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          
          # Copiar el binario del kernel
          cp "android-kernel/out/arch/arm64/boot/$KERNEL_FILE_NAME" AnyKernel3/$KERNEL_FILE_NAME
          
          # Copiar el archivo DTB emparejado si existe
          if [ "$HAVE_DTB" = "true" ] && [ -f "dtb" ]; then
            cp dtb AnyKernel3/dtb
            echo "[+] Archivo dtb copiado en AnyKernel3."
          fi

          # Copiar el archivo estático de configuración anykernel.sh del repositorio
          cp $GITHUB_WORKSPACE/.github/anykernel/anykernel.sh AnyKernel3/anykernel.sh

          echo "=== VERIFICACIÓN DE ESTRUCTURA ANYKERNEL3 ==="
          ls -la AnyKernel3/
          echo "============================================="

          rm -rf AnyKernel3/.git* AnyKernel3/README.md
          cd AnyKernel3
          zip -r9 ../Miatoll-NetHunter-Kernel.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AK3-Miatoll-NetHunter-KSU
          path: kernel_workspace/Miatoll-NetHunter-Kernel.zip
