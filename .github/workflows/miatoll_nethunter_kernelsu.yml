name: Build Miatoll Hacking Kernel V13 (NetHunter WiFi Fix)

on:
  workflow_dispatch:

env:
  TZ: America/New_York
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    name: Build Kernel for Miatoll
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set swap to 10G
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Setup build kernel environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib bzip2 libbz2-dev liblz4-tool make squashfs-tools dpkg-dev libssl-dev python3 libelf-dev bc libc6-dev-i386 gcc-multilib lld llvm
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace

      - name: Download crDroid 16.0 Native Toolchains (Clang 19 r530567 & GCC 4.9)
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          
          # Descargar Clang 19 r530567 mediante sparse-checkout para evitar cierres de conexión HTTP (EOF)
          echo "[+] Descargando AOSP Clang 19 (r530567) con Git sparse-checkout..."
          git clone --filter=blob:none --no-checkout --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b main clang_repo
          cd clang_repo
          git sparse-checkout set --cone clang-r530567
          git checkout main
          mv clang-r530567 $GITHUB_WORKSPACE/kernel_workspace/clang
          cd $GITHUB_WORKSPACE/kernel_workspace
          rm -rf clang_repo

          echo "[+] Verificando binario de Clang..."
          $GITHUB_WORKSPACE/kernel_workspace/clang/bin/clang --version

          # Descargar compiladores cruzados GCC 4.9
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

      - name: Download kernel source
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone https://github.com/crdroidandroid/android_kernel_xiaomi_sm6250 -b 16.0 android-kernel --depth=1
          cd android-kernel/scripts
          sed -i 's/ -dirty//g' setlocalversion

      # Etapa de Validación Científica A/B: Compilar kernel 100% puro crDroid 16.0 (sin KSU ni inyecciones)
      # para aislar la causa raíz y validar la cadena de compilación y empaquetado.
      - name: Prepare Clean crDroid 16.0 Defconfig
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          echo "[+] Preparando defconfig nativo puro de crDroid 16.0..."
          # No se aplican parches de terceros para establecer la línea base de arranque 100% limpia

      - name: Build Miatoll kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          
          export ARCH=arm64
          export KBUILD_BUILD_HOST=Github-Action
          export KBUILD_BUILD_USER=$(echo ${{ github.actor }} | tr A-Z a-z)
          
          export PATH="${GITHUB_WORKSPACE}/kernel_workspace/clang/bin:${PATH}:${GITHUB_WORKSPACE}/kernel_workspace/gcc32/bin:${PATH}:${GITHUB_WORKSPACE}/kernel_workspace/gcc64/bin:${PATH}"
          
          CC_ARGS="
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=${GITHUB_WORKSPACE}/kernel_workspace/gcc64/bin/aarch64-linux-android- \
            CROSS_COMPILE_ARM32=${GITHUB_WORKSPACE}/kernel_workspace/gcc32/bin/arm-linux-androideabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CONFIG_NO_ERROR_ON_MISMATCH=y \
            KCFLAGS=-w
          "
          
          make O=out $CC_ARGS vendor/xiaomi/miatoll_defconfig
          make -j$(nproc --all) O=out $CC_ARGS all || {
            echo "::error::Build failed in parallel mode! Rerunning with -j1 to isolate exact compiler error:"
            make -j1 O=out $CC_ARGS all
            exit 1
          }

      - name: Check and Locate Kernel Output Files
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          BOOT_DIR="android-kernel/out/arch/arm64/boot"
          
          # crDroid 16.0 usa el binario raw Image (BOARD_KERNEL_IMAGE_NAME := Image)
          if [ -f "$BOOT_DIR/Image" ]; then
            echo "KERNEL_FILE_NAME=Image" >> $GITHUB_ENV
            echo "CHECK_IMAGE=true" >> $GITHUB_ENV
            echo "✅ ¡Kernel raw Image detectado (crDroid 16.0 estándar)!"
          elif [ -f "$BOOT_DIR/Image.gz" ]; then
            echo "KERNEL_FILE_NAME=Image.gz" >> $GITHUB_ENV
            echo "CHECK_IMAGE=true" >> $GITHUB_ENV
            echo "✅ ¡Kernel Image.gz detectado!"
          else
            echo "🚨 ERROR: No se encontró ningún binario Image válido en $BOOT_DIR"
            exit 1
          fi

      - name: Make AnyKernel3
        run: |
          if [ "$CHECK_IMAGE" != "true" ]; then
            echo "Imagen del kernel no encontrada, saltando creación de AnyKernel3."
            exit 0
          fi

          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          
          # Patch ak3-core.sh to strip AVB0 footer on repack to resolve 4864 vs 2432 vbmeta size mismatch in Android 16
          python3 -c '
          import re

          with open("AnyKernel3/tools/ak3-core.sh", "r") as f:
              content = f.read()

          strip_fn = """
          strip_avb_footer() {
            local target="$1";
            [ ! -f "$target" ] && return 0;
            local fsize=$(wc -c < "$target" 2>/dev/null | tr -d " ");
            [ -z "$fsize" ] || [ "$fsize" -le 64 ] && return 0;
            local magic=$(tail -c 64 "$target" 2>/dev/null | head -c 4);
            if [ "$magic" = "AVB0" ]; then
              ui_print " ";
              ui_print "[!] Detected AVB0 footer on $target";
              ui_print "[+] Stripping AVB0 footer to fix 4864 vs 2432 vbmeta size mismatch...";
              local hex_size=$(od -A n -j $((fsize - 56)) -N 8 -t x1 "$target" 2>/dev/null | tr -d " \\n\\t\\r");
              if [ -n "$hex_size" ]; then
                local orig_size=$((0x$hex_size));
                if [ "$orig_size" -gt 0 ] && [ "$orig_size" -lt "$fsize" ]; then
                  ui_print "[+] Truncating image from $fsize bytes to original size: $orig_size bytes";
                  head -c "$orig_size" "$target" > "${target}.stripped";
                  mv -f "${target}.stripped" "$target";
                fi;
              fi;
            fi;
          }
          """

          content = strip_fn + "\n" + content
          content = re.sub(r"(magiskboot\s+repack\s+[^;]+boot-new\.img;?)", r"\1\n    strip_avb_footer $AKHOME/boot-new.img;", content)

          with open("AnyKernel3/tools/ak3-core.sh", "w") as f:
              f.write(content)
          print("[+] Successfully patched AnyKernel3 ak3-core.sh with AVB0 stripper!")
          '

          # Copiar el binario del kernel Image
          cp "android-kernel/out/arch/arm64/boot/$KERNEL_FILE_NAME" AnyKernel3/$KERNEL_FILE_NAME

          # Copiar el archivo estático de configuración anykernel.sh del repositorio
          cp $GITHUB_WORKSPACE/.github/anykernel/anykernel.sh AnyKernel3/anykernel.sh

          echo "=== VERIFICACIÓN DE ESTRUCTURA ANYKERNEL3 ==="
          ls -la AnyKernel3/
          echo "============================================="

          rm -rf AnyKernel3/.git* AnyKernel3/README.md
          cd AnyKernel3
          zip -r9 ../Miatoll-NetHunter-Kernel.zip *

      - name: Upload AnyKernel3 Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AK3-Miatoll-NetHunter-KSU
          path: kernel_workspace/Miatoll-NetHunter-Kernel.zip

      - name: Upload Standalone Raw Image (Direct Flash)
        uses: actions/upload-artifact@v4
        with:
          name: Miatoll-Kernel-Image-Raw
          path: kernel_workspace/android-kernel/out/arch/arm64/boot/Image
