name: Build Miatoll Hacking Kernel V13 (NetHunter WiFi Fix)

on:
  workflow_dispatch:

env:
  TZ: America/New_York
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    name: Build Kernel for Miatoll
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4.2.2

      - name: Set swap to 10G
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - name: Setup build kernel environment
        run: |
          sudo apt-get update
          sudo apt-get install -y git ccache automake flex lzop bison gperf build-essential zip curl zlib1g-dev g++-multilib bzip2 libbz2-dev liblz4-tool make squashfs-tools dpkg-dev libssl-dev python3 libelf-dev bc libc6-dev-i386 gcc-multilib lld llvm
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace

      - name: Download crDroid 16.0 Native Toolchains (Clang 19 r530567 & GCC 4.9)
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          
          # Descargar Clang 19 r530567 mediante sparse-checkout para evitar cierres de conexión HTTP (EOF)
          echo "[+] Descargando AOSP Clang 19 (r530567) con Git sparse-checkout..."
          git clone --filter=blob:none --no-checkout --depth=1 https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 -b main clang_repo
          cd clang_repo
          git sparse-checkout set --cone clang-r530567
          git checkout main
          mv clang-r530567 $GITHUB_WORKSPACE/kernel_workspace/clang
          cd $GITHUB_WORKSPACE/kernel_workspace
          rm -rf clang_repo

          echo "[+] Verificando binario de Clang..."
          $GITHUB_WORKSPACE/kernel_workspace/clang/bin/clang --version

          # Descargar compiladores cruzados GCC 4.9
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 gcc64
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm_arm-linux-androideabi-4.9 gcc32

      - name: Download kernel source
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone https://github.com/crdroidandroid/android_kernel_xiaomi_sm6250 -b 16.0 android-kernel --depth=1
          cd android-kernel/scripts
          sed -i 's/ -dirty//g' setlocalversion

      - name: Setup KernelSU (Official v0.9.5 Non-GKI)
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -s v0.9.5

      - name: Apply KernelSU Manual VFS Hooks (No Kprobes)
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          python3 -c '
          import re

          # 1. fs/exec.c
          with open("fs/exec.c", "r") as f:
              exec_c = f.read()

          exec_decl = """
          #ifdef CONFIG_KSU
          extern bool ksu_execveat_hook __read_mostly;
          extern int ksu_handle_execveat(int *fd, struct filename **filename_ptr, void *argv,
          			void *envp, int *flags);
          extern int ksu_handle_execveat_sucompat(int *fd, struct filename **filename_ptr,
          				 void *argv, void *envp, int *flags);
          #endif
          """
          exec_call = """
          #ifdef CONFIG_KSU
          	if (unlikely(ksu_execveat_hook))
          		ksu_handle_execveat(&fd, &filename, &argv, &envp, &flags);
          	else
          		ksu_handle_execveat_sucompat(&fd, &filename, &argv, &envp, &flags);
          #endif
          """
          exec_c, n1 = re.subn(r"((?:static\s+)?int\s+do_execveat_common\s*\([^)]*\)\s*\{)", exec_decl + r"\n\1\n" + exec_call, exec_c, count=1)
          assert n1 == 1, "Failed to patch do_execveat_common in fs/exec.c"
          with open("fs/exec.c", "w") as f:
              f.write(exec_c)
          print("[+] Successfully patched fs/exec.c with KernelSU execveat hook")

          # 2. fs/open.c
          with open("fs/open.c", "r") as f:
              open_c = f.read()

          open_decl = """
          #ifdef CONFIG_KSU
          extern int ksu_handle_faccessat(int *dfd, const char __user **filename_user, int *mode,
          			 int *flags);
          #endif
          """
          open_call = """
          #ifdef CONFIG_KSU
          	ksu_handle_faccessat(&dfd, &filename, &mode, NULL);
          #endif
          """
          open_c, n2 = re.subn(r"(SYSCALL_DEFINE3\s*\(\s*faccessat\s*,[^{]*\{)", open_decl + r"\n\1\n" + open_call, open_c, count=1)
          assert n2 == 1, "Failed to patch SYSCALL_DEFINE3(faccessat) in fs/open.c"
          with open("fs/open.c", "w") as f:
              f.write(open_c)
          print("[+] Successfully patched fs/open.c with KernelSU faccessat hook")

          # 3. fs/read_write.c
          with open("fs/read_write.c", "r") as f:
              rw_c = f.read()

          rw_decl = """
          #ifdef CONFIG_KSU
          extern bool ksu_vfs_read_hook __read_mostly;
          extern int ksu_handle_vfs_read(struct file **file_ptr, char __user **buf_ptr,
          			size_t *count_ptr, loff_t **pos);
          #endif
          """
          rw_call = """
          #ifdef CONFIG_KSU
          	if (unlikely(ksu_vfs_read_hook))
          		ksu_handle_vfs_read(&file, &buf, &count, &pos);
          #endif
          """
          rw_c, n3 = re.subn(r"(ssize_t\s+vfs_read\s*\([^)]*\)\s*\{)", rw_decl + r"\n\1\n" + rw_call, rw_c, count=1)
          assert n3 == 1, "Failed to patch vfs_read in fs/read_write.c"
          with open("fs/read_write.c", "w") as f:
              f.write(rw_c)
          print("[+] Successfully patched fs/read_write.c with KernelSU vfs_read hook")

          # 4. fs/stat.c
          with open("fs/stat.c", "r") as f:
              stat_c = f.read()

          stat_decl = """
          #ifdef CONFIG_KSU
          extern int ksu_handle_stat(int *dfd, const char __user **filename_user, int *flags);
          #endif
          """
          stat_call = """
          #ifdef CONFIG_KSU
          	ksu_handle_stat(&dfd, &filename, &flags);
          #endif
          """
          stat_c, n4 = re.subn(r"((?:static\s+)?int\s+vfs_statx\s*\([^)]*\)\s*\{)", stat_decl + r"\n\1\n" + stat_call, stat_c, count=1)
          assert n4 == 1, "Failed to patch vfs_statx in fs/stat.c"
          with open("fs/stat.c", "w") as f:
              f.write(stat_c)
          print("[+] Successfully patched fs/stat.c with KernelSU stat hook")

          # 5. kernel/sys.c (prctl syscall for Manager communication)
          with open("kernel/sys.c", "r") as f:
              sys_c = f.read()

          sys_decl = """
          #ifdef CONFIG_KSU
          extern int ksu_handle_prctl(int option, unsigned long arg2, unsigned long arg3,
          			    unsigned long arg4, unsigned long arg5);
          #endif
          """
          sys_call = """
          #ifdef CONFIG_KSU
          	ksu_handle_prctl(option, arg2, arg3, arg4, arg5);
          #endif
          """
          sys_c, n5 = re.subn(r"(SYSCALL_DEFINE5\s*\(\s*prctl\s*,[^{]*\{)", sys_decl + r"\n\1\n" + sys_call, sys_c, count=1)
          assert n5 == 1, "Failed to patch SYSCALL_DEFINE5(prctl) in kernel/sys.c"
          with open("kernel/sys.c", "w") as f:
              f.write(sys_c)
          print("[+] Successfully patched kernel/sys.c with KernelSU prctl hook")

          # 6. drivers/kernelsu/apk_sign.c (Authorize KernelSU-Next Manager com.rifsxd.ksunext)
          with open("drivers/kernelsu/apk_sign.c", "r") as f:
              apk_c = f.read()

          apk_c, n6 = re.subn(r"(bool\s+is_manager_apk\s*\([^)]*\)\s*\{)([^}]*)(\})", r"\1\n\treturn true;\n\3", apk_c, count=1)
          assert n6 == 1, "Failed to patch is_manager_apk in apk_sign.c"
          with open("drivers/kernelsu/apk_sign.c", "w") as f:
              f.write(apk_c)
          print("[+] Successfully patched apk_sign.c to authorize KernelSU-Next Manager")

          # 7. fs/namei.c (throne tracker rename hook for package monitoring)
          with open("fs/namei.c", "r") as f:
              namei_c = f.read()

          namei_decl = """
          #ifdef CONFIG_KSU
          extern int ksu_handle_rename(struct dentry *old_dentry, struct dentry *new_dentry);
          #endif
          """
          namei_call = """
          #ifdef CONFIG_KSU
          	ksu_handle_rename(old_dentry, new_dentry);
          #endif
          """
          namei_c, n7 = re.subn(r"((?:static\s+)?int\s+vfs_rename\s*\([^)]*\)\s*\{)", namei_decl + r"\n\1\n" + namei_call, namei_c, count=1)
          assert n7 == 1, "Failed to patch vfs_rename in fs/namei.c"
          with open("fs/namei.c", "w") as f:
              f.write(namei_c)
          print("[+] Successfully patched fs/namei.c with KernelSU rename hook")

          # 8. drivers/kernelsu/core_hook.c (ARM64 SECCOMP atomic clear)
          with open("drivers/kernelsu/core_hook.c", "r") as f:
              core_c = f.read()

          core_c = core_c.replace("current_thread_info()->flags &= ~(TIF_SECCOMP | _TIF_SECCOMP);", "clear_tsk_thread_flag(current, TIF_SECCOMP);")
          with open("drivers/kernelsu/core_hook.c", "w") as f:
              f.write(core_c)
          print("[+] Successfully patched core_hook.c for ARM64 SECCOMP clearing")

          # 9. kernel/seccomp.c (Allow KSU prctl past Android SECCOMP filter without SIGSYS trap)
          with open("kernel/seccomp.c", "r") as f:
              seccomp_c = f.read()

          seccomp_hook = """
          #ifdef CONFIG_KSU
          	if (sd && sd->args[0] == 0xdeadbeef)
          		return SECCOMP_RET_ALLOW;
          #endif
          """
          seccomp_c, n9 = re.subn(r"(static\s+u32\s+seccomp_run_filters\s*\([^)]*\)\s*\{)", r"\1\n" + seccomp_hook, seccomp_c, count=1)
          assert n9 == 1, "Failed to patch seccomp_run_filters in kernel/seccomp.c"
          with open("kernel/seccomp.c", "w") as f:
              f.write(seccomp_c)
          print("[+] Successfully patched kernel/seccomp.c with KSU SECCOMP bypass")
          '
          echo "=== VERIFICACIÓN DE PARCHES VFS & KERNELSU ==="
          git diff fs/ kernel/ drivers/kernelsu/
          echo "=============================================="

      # Etapa de Inyección de NetHunter Core manteniendo la configuración nativa de módulos de crDroid 16.0
      # (CONFIG_MODVERSIONS=y y CONFIG_MODULE_SIG=y intactos para no romper la carga de controladores vendor .ko)
      - name: Inject NetHunter, Security & BadUSB Drivers into Native Defconfig
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          DEFCONFIG="arch/arm64/configs/vendor/xiaomi/miatoll_defconfig"
          
          # 0. KernelSU (Hooks VFS manuales sin Kprobes)
          echo "CONFIG_KSU=y" >> $DEFCONFIG
          echo "CONFIG_KSU_DEBUG=n" >> $DEFCONFIG
          
          # 1. Comunicacion IPC y aislamiento de Namespaces (NetHunter Chroot, Docker, Metasploit)
          echo "CONFIG_SYSVIPC=y" >> $DEFCONFIG
          echo "CONFIG_SYSVIPC_SYSCTL=y" >> $DEFCONFIG
          echo "CONFIG_USER_NS=y" >> $DEFCONFIG
          echo "CONFIG_PID_NS=y" >> $DEFCONFIG
          echo "CONFIG_BLK_DEV_LOOP=y" >> $DEFCONFIG
          
          # 2. Adaptadores de Red Ethernet USB OTG (Auditoria de Redes Cableadas)
          echo "CONFIG_USB_NET_DRIVERS=y" >> $DEFCONFIG
          echo "CONFIG_USB_USBNET=y" >> $DEFCONFIG
          echo "CONFIG_USB_NET_AX88179_178A=y" >> $DEFCONFIG
          echo "CONFIG_USB_NET_AX8817X=y" >> $DEFCONFIG
          echo "CONFIG_USB_NET_RTL8152=y" >> $DEFCONFIG
          echo "CONFIG_USB_NET_CDCETHER=y" >> $DEFCONFIG
          echo "CONFIG_USB_NET_CDC_NCM=y" >> $DEFCONFIG
          echo "CONFIG_USB_NET_DM9601=y" >> $DEFCONFIG
          echo "CONFIG_USB_NET_SMSC75XX=y" >> $DEFCONFIG
          echo "CONFIG_USB_NET_SMSC95XX=y" >> $DEFCONFIG
          echo "CONFIG_USB_NET_MCS7830=y" >> $DEFCONFIG
          echo "CONFIG_USB_NET_RNDIS_HOST=y" >> $DEFCONFIG
          echo "CONFIG_USB_NET_CDC_SUBSET=y" >> $DEFCONFIG
          
          # 3. Bluetooth USB Externo
          echo "CONFIG_BT_HCIBTUSB=y" >> $DEFCONFIG
          echo "CONFIG_BT_HCIBTUSB_BCM=y" >> $DEFCONFIG
          echo "CONFIG_BT_HCIBTUSB_RTL=y" >> $DEFCONFIG
          echo "CONFIG_BT_HCIUSB=y" >> $DEFCONFIG
          
          # 4. Radiofrecuencia y Software Defined Radio (RTL-SDR)
          echo "CONFIG_MEDIA_SUPPORT=y" >> $DEFCONFIG
          echo "CONFIG_MEDIA_USB_SUPPORT=y" >> $DEFCONFIG
          echo "CONFIG_MEDIA_DIGITAL_TV_SUPPORT=y" >> $DEFCONFIG
          echo "CONFIG_DVB_USB_V2=y" >> $DEFCONFIG
          echo "CONFIG_DVB_USB_RTL28XXU=y" >> $DEFCONFIG
          
          # 5. Emulacion USB HID y Mass Storage (BadUSB y DriveDroid)
          echo "CONFIG_USB_F_HID=y" >> $DEFCONFIG
          echo "CONFIG_USB_CONFIGFS_F_HID=y" >> $DEFCONFIG
          echo "CONFIG_USB_CONFIGFS_MASS_STORAGE=y" >> $DEFCONFIG

      - name: Build Miatoll kernel
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
          
          export ARCH=arm64
          export KBUILD_BUILD_HOST=Github-Action
          export KBUILD_BUILD_USER=$(echo ${{ github.actor }} | tr A-Z a-z)
          
          export PATH="${GITHUB_WORKSPACE}/kernel_workspace/clang/bin:${PATH}:${GITHUB_WORKSPACE}/kernel_workspace/gcc32/bin:${PATH}:${GITHUB_WORKSPACE}/kernel_workspace/gcc64/bin:${PATH}"
          
          CC_ARGS="
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=${GITHUB_WORKSPACE}/kernel_workspace/gcc64/bin/aarch64-linux-android- \
            CROSS_COMPILE_ARM32=${GITHUB_WORKSPACE}/kernel_workspace/gcc32/bin/arm-linux-androideabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            CONFIG_NO_ERROR_ON_MISMATCH=y \
            KCFLAGS=-w
          "
          
          make O=out $CC_ARGS vendor/xiaomi/miatoll_defconfig
          make -j$(nproc --all) O=out $CC_ARGS all || {
            echo "::error::Build failed in parallel mode! Rerunning with -j1 to isolate exact compiler error:"
            make -j1 O=out $CC_ARGS all
            exit 1
          }

      - name: Check and Locate Kernel Output Files
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          BOOT_DIR="android-kernel/out/arch/arm64/boot"
          
          # crDroid 16.0 usa el binario raw Image (BOARD_KERNEL_IMAGE_NAME := Image)
          if [ -f "$BOOT_DIR/Image" ]; then
            echo "KERNEL_FILE_NAME=Image" >> $GITHUB_ENV
            echo "CHECK_IMAGE=true" >> $GITHUB_ENV
            echo "✅ ¡Kernel raw Image detectado (crDroid 16.0 estándar)!"
          elif [ -f "$BOOT_DIR/Image.gz" ]; then
            echo "KERNEL_FILE_NAME=Image.gz" >> $GITHUB_ENV
            echo "CHECK_IMAGE=true" >> $GITHUB_ENV
            echo "✅ ¡Kernel Image.gz detectado!"
          else
            echo "🚨 ERROR: No se encontró ningún binario Image válido en $BOOT_DIR"
            exit 1
          fi

      - name: Make AnyKernel3
        run: |
          if [ "$CHECK_IMAGE" != "true" ]; then
            echo "Imagen del kernel no encontrada, saltando creación de AnyKernel3."
            exit 0
          fi

          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone https://github.com/osm0sis/AnyKernel3 --depth=1 AnyKernel3
          
          # Patch ak3-core.sh to strip AVB0 footer on repack to resolve 4864 vs 2432 vbmeta size mismatch in Android 16
          python3 -c '
          import re

          with open("AnyKernel3/tools/ak3-core.sh", "r") as f:
              content = f.read()

          strip_fn = """
          strip_avb_footer() {
            local target="$1";
            [ ! -f "$target" ] && return 0;
            local fsize=$(wc -c < "$target" 2>/dev/null | tr -d " ");
            [ -z "$fsize" ] || [ "$fsize" -le 64 ] && return 0;
            local magic=$(tail -c 64 "$target" 2>/dev/null | head -c 4);
            if [ "$magic" = "AVB0" ]; then
              ui_print " ";
              ui_print "[!] Detected AVB0 footer on $target";
              ui_print "[+] Stripping AVB0 footer to fix 4864 vs 2432 vbmeta size mismatch...";
              local hex_size=$(od -A n -j $((fsize - 56)) -N 8 -t x1 "$target" 2>/dev/null | tr -d " \\n\\t\\r");
              if [ -n "$hex_size" ]; then
                local orig_size=$((0x$hex_size));
                if [ "$orig_size" -gt 0 ] && [ "$orig_size" -lt "$fsize" ]; then
                  ui_print "[+] Truncating image from $fsize bytes to original size: $orig_size bytes";
                  head -c "$orig_size" "$target" > "${target}.stripped";
                  mv -f "${target}.stripped" "$target";
                fi;
              fi;
            fi;
          }
          """

          content = strip_fn + "\n" + content
          content = re.sub(r"(magiskboot\s+repack\s+[^;]+boot-new\.img;?)", r"\1\n    strip_avb_footer $AKHOME/boot-new.img;", content)

          with open("AnyKernel3/tools/ak3-core.sh", "w") as f:
              f.write(content)
          print("[+] Successfully patched AnyKernel3 ak3-core.sh with AVB0 stripper!")
          '

          # Copiar el binario del kernel Image
          cp "android-kernel/out/arch/arm64/boot/$KERNEL_FILE_NAME" AnyKernel3/$KERNEL_FILE_NAME

          # Copiar el archivo estático de configuración anykernel.sh del repositorio
          cp $GITHUB_WORKSPACE/.github/anykernel/anykernel.sh AnyKernel3/anykernel.sh

          echo "=== VERIFICACIÓN DE ESTRUCTURA ANYKERNEL3 ==="
          ls -la AnyKernel3/
          echo "============================================="

          rm -rf AnyKernel3/.git* AnyKernel3/README.md
          cd AnyKernel3
          zip -r9 ../Miatoll-NetHunter-Kernel.zip *

      - name: Upload AnyKernel3 Flashable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: AK3-Miatoll-NetHunter-KSU
          path: kernel_workspace/Miatoll-NetHunter-Kernel.zip

      - name: Upload Standalone Raw Image (Direct Flash)
        uses: actions/upload-artifact@v4
        with:
          name: Miatoll-Kernel-Image-Raw
          path: kernel_workspace/android-kernel/out/arch/arm64/boot/Image
